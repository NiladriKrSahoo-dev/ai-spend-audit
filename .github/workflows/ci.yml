name: Vantage CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check for Linting Errors
        run: npm run lint
        continue-on-error: true # Keeps the build going even if there are tiny style warnings

      - name: Run Automated Tests
        run: npm test
